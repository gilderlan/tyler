[project]
name = "tyler"
version = "0.1.0"
description = "Editor de vídeo comandado por IA: reframe, blur de rostos e placas, e mais."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "open-image-models[onnx]>=0.6.0",
    "opencv-python-headless>=5.0.0.93",
    "psutil>=7.2.2",
    "rich>=15.0.0",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
tyler = "tyler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tyler"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
